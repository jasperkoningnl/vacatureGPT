name: Weekly vacancy email

on:
  workflow_dispatch:
  schedule:
    # Tuesday 07:00 UTC, 1 hour and 45 minutes after the daily pipeline starts.
    - cron: "0 7 * * 2"

permissions:
  contents: read

concurrency:
  group: weekly-vacancy-email
  cancel-in-progress: false

jobs:
  email:
    name: Send weekly vacancy email
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm 10.28.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        id: migration
        run: pnpm db:migrate

      - name: Select and send weekly vacancies
        id: digest
        run: pnpm email:weekly

      - name: Write failure summary
        if: ${{ always() && steps.digest.outcome != 'success' }}
        env:
          DIGEST_OUTCOME: ${{ steps.digest.outcome }}
        run: |
          {
            echo "## Weekly vacancy email"
            echo
            echo "- Eligible candidates: 0"
            echo "- Sent: 0"
            echo "- Status: failed"
            echo "- Error: workflow step failed or was skipped (${DIGEST_OUTCOME})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send weekly workflow failure alert
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm email:pipeline-failure --weekly
